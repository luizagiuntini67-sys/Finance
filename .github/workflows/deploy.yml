name: Atualizar dados e publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # A cada 30 min durante o pregão da B3 (seg-sex, ~10h-18h BRT = 13h-21h UTC)
    - cron: "*/30 13-21 * * 1-5"
    # Uma vez por dia fora do pregão para fechar o dia
    - cron: "15 23 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar dados do Yahoo Finance
        run: python scripts/fetch_data.py

      - name: Montar site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r data _site/data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
